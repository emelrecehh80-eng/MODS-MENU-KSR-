<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=yes">
    <meta name="theme-color" content="#12162a">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <link rel="manifest" href="manifest.json">
    <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>⚡</text></svg>">
    <title>KSR MODS OFFICIAL - Pembayaran QRIS Otomatis</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0-beta3/css/all.min.css">
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Segoe UI', Roboto, system-ui, sans-serif;
        }

        body {
            background: #0b0e1a;
            color: #eef2f7;
            padding: 0 0 40px 0;
            overflow-x: hidden;
        }

        .container {
            max-width: 500px;
            margin: 0 auto;
            background: #12162a;
            min-height: 100vh;
            box-shadow: 0 0 30px rgba(0,0,0,0.7);
            padding: 16px 16px 30px;
        }

        /* NAVBAR */
        .navbar {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 8px 0 14px 0;
            border-bottom: 1px solid #1f2544;
            margin-bottom: 16px;
        }

        .navbar .logo {
            font-size: 20px;
            font-weight: 800;
            color: white;
            display: flex;
            align-items: center;
            gap: 8px;
        }

        .navbar .logo span {
            background: linear-gradient(135deg, #00e676, #00c853);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
        }

        .navbar .logo i {
            color: #00e676;
            -webkit-text-fill-color: #00e676;
        }

        .nav-menu {
            display: flex;
            gap: 16px;
            align-items: center;
        }

        .nav-menu a {
            color: #b9c8ff;
            text-decoration: none;
            font-size: 13px;
            font-weight: 600;
            transition: 0.2s;
            padding: 6px 12px;
            border-radius: 30px;
            cursor: pointer;
        }

        .nav-menu a:hover {
            background: #1f2544;
            color: white;
        }

        .nav-menu a.active {
            background: #00e676;
            color: #0b0e1a;
        }

        .nav-menu .menu-icon {
            display: none;
            font-size: 24px;
            color: white;
            cursor: pointer;
        }

        /* MOBILE MENU */
        .mobile-menu {
            display: none;
            background: #1a1f3a;
            border-radius: 16px;
            padding: 16px;
            margin-bottom: 16px;
            border: 1px solid #2f3a6b;
            flex-direction: column;
            gap: 10px;
        }

        .mobile-menu.show {
            display: flex;
        }

        .mobile-menu a {
            color: #b9c8ff;
            text-decoration: none;
            padding: 10px 16px;
            border-radius: 12px;
            font-weight: 600;
            transition: 0.2s;
            cursor: pointer;
        }

        .mobile-menu a:hover {
            background: #2f3a6b;
            color: white;
        }

        .mobile-menu a i {
            margin-right: 12px;
            width: 20px;
            color: #00e676;
        }

        /* LIVE BAR */
        .live-bar {
            background: #1f2544;
            border-radius: 30px;
            padding: 8px 18px;
            display: flex;
            align-items: center;
            gap: 10px;
            font-size: 13px;
            font-weight: 500;
            color: #b9c8ff;
            margin-bottom: 18px;
            border: 1px solid #2f3a6b;
            flex-wrap: wrap;
        }

        .live-dot {
            display: inline-block;
            width: 10px;
            height: 10px;
            background: #00e676;
            border-radius: 50%;
            animation: pulse 1.5s infinite;
            margin-right: 4px;
        }

        @keyframes pulse {
            0% { opacity: 0.3; transform: scale(0.9); }
            50% { opacity: 1; transform: scale(1.2); }
            100% { opacity: 0.3; transform: scale(0.9); }
        }

        .live-text {
            color: #fff;
            font-weight: 600;
        }

        .order-scroll {
            display: flex;
            overflow-x: auto;
            gap: 14px;
            padding: 6px 0 14px 0;
            white-space: nowrap;
            scrollbar-width: thin;
            scrollbar-color: #3b4780 #1f2544;
            -webkit-overflow-scrolling: touch;
        }

        .order-scroll::-webkit-scrollbar {
            height: 4px;
        }
        .order-scroll::-webkit-scrollbar-track {
            background: #1f2544;
            border-radius: 10px;
        }
        .order-scroll::-webkit-scrollbar-thumb {
            background: #3b4780;
            border-radius: 10px;
        }

        .order-chip {
            background: #1f2544;
            padding: 6px 18px 6px 14px;
            border-radius: 40px;
            border-left: 3px solid #00e676;
            font-size: 13px;
            color: #cfdbff;
            box-shadow: 0 2px 6px rgba(0,0,0,0.5);
            display: inline-flex;
            align-items: center;
            gap: 6px;
            flex-shrink: 0;
        }

        .order-chip i {
            color: #00e676;
            font-size: 12px;
        }

        .order-chip strong {
            color: white;
            font-weight: 600;
        }

        .badge-qris {
            background: #00e676;
            color: #0b0e1a;
            font-size: 9px;
            font-weight: 800;
            padding: 2px 10px;
            border-radius: 30px;
            margin-left: 6px;
            letter-spacing: 0.3px;
        }

        .section-title {
            display: flex;
            justify-content: space-between;
            align-items: baseline;
            margin: 24px 0 12px 0;
        }

        .section-title h2 {
            font-size: 20px;
            font-weight: 700;
            background: linear-gradient(135deg, #b3c7ff, #7a93f0);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
        }

        .section-title a {
            color: #7a93f0;
            font-size: 13px;
            font-weight: 500;
            text-decoration: none;
            cursor: pointer;
        }

        .product-grid {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 14px;
        }

        .product-card {
            background: #1a1f3a;
            border-radius: 20px;
            padding: 16px 12px 14px;
            border: 1px solid #2b3158;
            transition: 0.2s;
            box-shadow: 0 6px 12px rgba(0,0,0,0.4);
            cursor: pointer;
            user-select: none;
            -webkit-tap-highlight-color: transparent;
        }

        .product-card:active {
            transform: scale(0.97);
            border-color: #00e676;
        }

        .product-card .category-tag {
            background: #2f3a6b;
            display: inline-block;
            font-size: 10px;
            font-weight: 700;
            padding: 3px 12px;
            border-radius: 30px;
            letter-spacing: 0.5px;
            color: #b0c5ff;
            margin-bottom: 10px;
        }

        .product-card h3 {
            font-size: 16px;
            font-weight: 700;
            margin-bottom: 4px;
            color: white;
        }

        .product-card .price-range {
            font-size: 13px;
            color: #b9cbff;
            margin: 8px 0 10px;
        }

        .product-card .price-range i {
            color: #ffc107;
            margin-right: 4px;
        }

        .product-stats {
            display: flex;
            justify-content: space-between;
            font-size: 12px;
            color: #99abdf;
            border-top: 1px solid #2a3158;
            padding-top: 10px;
            margin-top: 4px;
        }

        .product-stats span i {
            margin-right: 4px;
            color: #ffb347;
        }

        /* LEADERBOARD */
        .leaderboard {
            background: #10152b;
            border-radius: 24px;
            padding: 16px 14px;
            margin: 24px 0 20px;
            border: 1px solid #27305a;
        }

        .leaderboard-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 16px;
        }

        .leaderboard-header h3 {
            font-size: 18px;
            font-weight: 700;
            color: #ffd966;
        }

        .leaderboard-header i {
            color: #ffb347;
            font-size: 20px;
        }

        .lb-item {
            display: flex;
            align-items: center;
            gap: 12px;
            padding: 10px 0;
            border-bottom: 1px solid #20264a;
        }

        .lb-item:last-child {
            border-bottom: none;
        }

        .lb-rank {
            font-weight: 800;
            font-size: 18px;
            width: 30px;
            color: #7f93d4;
        }

        .lb-rank.gold { color: #ffd966; }
        .lb-rank.silver { color: #c0cbd6; }
        .lb-rank.bronze { color: #cd9f6e; }

        .lb-avatar {
            width: 44px;
            height: 44px;
            background: #29315f;
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            font-weight: 700;
            font-size: 18px;
            color: white;
            flex-shrink: 0;
        }

        .lb-info {
            flex: 1;
        }

        .lb-name {
            font-weight: 700;
            font-size: 16px;
        }

        .lb-trans {
            font-size: 13px;
            color: #b0c2f0;
        }

        .lb-badge {
            background: #2f3a6b;
            padding: 2px 12px;
            border-radius: 30px;
            font-size: 12px;
            font-weight: 600;
            color: #c9d8ff;
        }

        .stats-grid {
            display: grid;
            grid-template-columns: repeat(4, 1fr);
            gap: 8px;
            background: #131a32;
            padding: 14px 6px;
            border-radius: 24px;
            margin: 20px 0;
            text-align: center;
            border: 1px solid #29315a;
        }

        .stat-item {
            font-size: 12px;
            color: #aab9ed;
        }

        .stat-item strong {
            display: block;
            font-size: 20px;
            color: white;
            font-weight: 700;
        }

        .testimonial-scroll {
            display: flex;
            overflow-x: auto;
            gap: 14px;
            padding: 8px 0 18px;
            scrollbar-width: thin;
            -webkit-overflow-scrolling: touch;
        }

        .testimonial-card {
            background: #191f3d;
            border-radius: 24px;
            padding: 16px 18px;
            min-width: 220px;
            border: 1px solid #2b3260;
            flex-shrink: 0;
        }

        .testimonial-card .stars {
            color: #ffb347;
            letter-spacing: 2px;
            font-size: 14px;
        }

        .testimonial-card p {
            margin: 10px 0 8px;
            font-size: 14px;
            line-height: 1.5;
            color: #d3dfff;
        }

        .testimonial-card .verified {
            font-size: 12px;
            color: #73b37b;
        }

        .testimonial-card .time {
            font-size: 11px;
            color: #7c8fc9;
        }

        .faq-item {
            background: #181f3e;
            border-radius: 18px;
            padding: 16px 18px;
            margin-bottom: 12px;
            border-left: 4px solid #ffb347;
        }

        .faq-item h4 {
            font-size: 16px;
            font-weight: 600;
            color: white;
            margin-bottom: 6px;
        }

        .faq-item p {
            font-size: 14px;
            color: #bfceff;
            line-height: 1.5;
        }

        /* MODAL QRIS */
        .modal-overlay {
            display: none;
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(0,0,0,0.85);
            z-index: 9999;
            justify-content: center;
            align-items: center;
            padding: 20px;
        }

        .modal-overlay.active {
            display: flex !important;
        }

        .modal-content {
            background: #1a1f3a;
            max-width: 440px;
            width: 100%;
            border-radius: 32px;
            padding: 24px 20px 28px;
            border: 1px solid #2f3a6b;
            box-shadow: 0 20px 60px rgba(0,0,0,0.9);
            animation: slideUp 0.3s ease;
            max-height: 95vh;
            overflow-y: auto;
        }

        @keyframes slideUp {
            from { transform: translateY(30px); opacity: 0; }
            to { transform: translateY(0); opacity: 1; }
        }

        .modal-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 16px;
        }

        .modal-header h3 {
            font-size: 18px;
            font-weight: 700;
            color: white;
            display: flex;
            align-items: center;
            gap: 8px;
        }

        .modal-header h3 i {
            color: #00e676;
        }

        .modal-close {
            background: #2f3a6b;
            border: none;
            color: white;
            width: 40px;
            height: 40px;
            border-radius: 50%;
            font-size: 22px;
            cursor: pointer;
            transition: 0.2s;
        }

        .modal-close:hover {
            background: #ff3b6f;
        }

        .product-detail-modal {
            background: #121833;
            border-radius: 16px;
            padding: 14px 16px;
            margin-bottom: 16px;
            border-left: 4px solid #00e676;
        }

        .product-detail-modal .category {
            font-size: 14px;
            font-weight: 600;
            color: #b9cbff;
        }

        .product-detail-modal .name {
            font-weight: 700;
            font-size: 18px;
            color: white;
        }

        .product-detail-modal .price {
            color: #ffc107;
            font-size: 20px;
            font-weight: 800;
            margin-top: 4px;
        }

        /* QRIS CARD */
        .qris-card {
            background: white;
            border-radius: 20px;
            padding: 20px 18px 18px;
            margin: 10px 0 16px;
            box-shadow: 0 4px 20px rgba(0,0,0,0.3);
        }

        .qris-card .shop-name {
            font-size: 16px;
            font-weight: 800;
            color: #1a1f3a;
            text-align: center;
            letter-spacing: 0.5px;
            margin-bottom: 2px;
        }

        .qris-card .shop-sub {
            font-size: 11px;
            color: #666;
            text-align: center;
            font-weight: 500;
            margin-bottom: 12px;
        }

        .qris-card .qris-tags {
            display: flex;
            justify-content: center;
            gap: 8px;
            font-size: 11px;
            font-weight: 600;
            color: #1a1f3a;
            margin-bottom: 10px;
            flex-wrap: wrap;
        }

        .qris-card .qris-tags span {
            background: #f0f2f5;
            padding: 2px 12px;
            border-radius: 30px;
        }

        .qris-card .qris-tags .check {
            background: #00e676;
            padding: 2px 12px;
            border-radius: 30px;
        }

        .qris-card .qris-row {
            display: flex;
            align-items: center;
            justify-content: space-between;
            background: #f5f7fa;
            padding: 8px 14px;
            border-radius: 12px;
            margin: 6px 0;
        }

        .qris-card .qris-row .label {
            font-size: 12px;
            color: #888;
            font-weight: 500;
        }

        .qris-card .qris-row .value {
            font-size: 13px;
            font-weight: 700;
            color: #1a1f3a;
        }

        .qris-card .qris-row .value i {
            color: #00e676;
            margin-right: 4px;
        }

        .qris-card .qr-placeholder {
            background: #e8ecf1;
            border-radius: 16px;
            padding: 30px 20px;
            text-align: center;
            margin: 14px 0 12px;
            border: 2px dashed #00e676;
            cursor: pointer;
            transition: 0.2s;
        }

        .qris-card .qr-placeholder:hover {
            background: #d5dbe5;
        }

        .qris-card .qr-placeholder i {
            font-size: 72px;
            color: #00e676;
            display: block;
            margin-bottom: 6px;
        }

        .qris-card .qr-placeholder .qr-text {
            font-size: 11px;
            color: #555;
            font-weight: 500;
            letter-spacing: 1px;
        }

        .qris-card .qr-placeholder .print-id {
            font-size: 10px;
            color: #999;
            margin-top: 4px;
        }

        .qris-card .qris-footer {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-top: 12px;
            padding-top: 12px;
            border-top: 1px solid #eee;
            flex-wrap: wrap;
            gap: 8px;
        }

        .qris-card .qris-footer .print-info {
            font-size: 11px;
            color: #999;
        }

        .qris-card .qris-footer .print-info strong {
            color: #333;
        }

        .btn-download-qris {
            background: #00e676;
            border: none;
            padding: 10px 20px;
            border-radius: 40px;
            font-weight: 700;
            font-size: 14px;
            color: #0b0e1a;
            cursor: pointer;
            transition: 0.2s;
            display: flex;
            align-items: center;
            gap: 8px;
        }

        .btn-download-qris:hover {
            background: #00c853;
            transform: scale(1.02);
        }

        .btn-download-qris:active {
            transform: scale(0.95);
        }

        /* PAYMENT STATUS */
        .payment-status {
            background: #0f142b;
            border-radius: 16px;
            padding: 14px 16px;
            margin-top: 14px;
            border: 1px solid #2a3158;
            display: flex;
            align-items: center;
            gap: 12px;
            flex-wrap: wrap;
        }

        .payment-status .status-dot {
            width: 14px;
            height: 14px;
            border-radius: 50%;
            background: #ff9800;
            animation: pulse 1.5s infinite;
            flex-shrink: 0;
        }

        .payment-status .status-dot.success {
            background: #00e676;
            animation: none;
        }

        .payment-status .status-text {
            font-size: 13px;
            color: #b9cbff;
            flex: 1;
        }

        .payment-status .status-text strong {
            color: white;
        }

        .btn-check-payment {
            background: #2f3a6b;
            border: none;
            color: white;
            padding: 8px 16px;
